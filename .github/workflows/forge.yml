name: Idea Forge (daily)

on:
  schedule:
    - cron: "7 4 * * *"      # every day, 07:07 Addis Ababa time — PDF arrives ~08:00
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [check, run, demo]
        default: check

permissions:
  contents: write

concurrency:
  group: idea-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # automatic; used for the "public attention" check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: python forge_run.py ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'run' }}
      - name: Save encrypted memory
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.task == 'run')
        run: |
          git config user.name "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          git add state/forge.db.enc 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "forge memory [skip ci]"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
